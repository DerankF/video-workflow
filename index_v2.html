<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>流程化创造学习视频</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;margin:0 auto;}

#root{
  width:1080px;height:1920px;position:relative;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}

/* 通用场景 */
.scene{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  opacity:0;pointer-events:none;
}

/* 场景1: 焦虑学习 0-3s */
#s1{
  background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a1e 100%);
  animation:s1_appear 0.3s 0s forwards,s1_fadeout 0.3s 2.7s forwards;
}
@keyframes s1_appear{to{opacity:1}}
@keyframes s1_fadeout{to{opacity:0}}

.s1_books{display:flex;gap:30px;margin-bottom:60px}
.s1_book{
  width:140px;height:90px;border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  animation:book_float 2s infinite ease-in-out;
}
.s1_book:nth-child(1){background:linear-gradient(135deg,#667eea,#764ba2);animation-delay:0s;transform:rotate(-15deg)}
.s1_book:nth-child(2){background:linear-gradient(135deg,#f093fb,#f5576c);animation-delay:0.3s;transform:rotate(8deg)}
.s1_book:nth-child(3){background:linear-gradient(135deg,#4facfe,#00f2fe);animation-delay:0.6s;transform:rotate(-5deg)}
.s1_book:nth-child(4){background:linear-gradient(135deg,#43e97b,#38f9d7);animation-delay:0.9s;transform:rotate(12deg)}

@keyframes book_float{
  0%,100%{transform:translateY(0) var(--base-rot)}
  50%{transform:translateY(-10px) var(--base-rot)}
}
.s1_book:nth-child(1){--base-rot:rotate(-15deg)}
.s1_book:nth-child(2){--base-rot:rotate(8deg)}
.s1_book:nth-child(3){--base-rot:rotate(-5deg)}
.s1_book:nth-child(4){--base-rot:rotate(12deg)}

.s1_laptop{
  width:240px;height:160px;background:linear-gradient(180deg,#2d2d5e,#1a1a3e);
  border-radius:12px;border:3px solid #4a4a8e;margin-bottom:40px;
  display:flex;justify-content:center;align-items:center;
  animation:laptop_glow 1s infinite alternate;
}
@keyframes laptop_glow{
  0%{box-shadow:0 0 20px rgba(255,107,107,0.3)}
  100%{box-shadow:0 0 60px rgba(255,107,107,0.8)}
}
.s1_laptop span{color:#ff6b6b;font-size:48px;font-weight:900}

.s1_sub{
  background:rgba(0,0,0,0.7);padding:30px 60px;border-radius:20px;
  font-size:44px;color:#fff;text-align:center;letter-spacing:4px;
  backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
  animation:sub_in 0.5s 0.5s forwards,sub_out 0.3s 2.5s forwards;
  opacity:0;
}
@keyframes sub_in{to{opacity:1;transform:translateY(0)}}
@keyframes sub_out{to{opacity:0;transform:translateY(-30px)}}
.s1_sub{transform:translateY(50px)}

/* 场景2: 知识混乱 3-6s */
#s2{
  background:radial-gradient(ellipse at center,#2d1b4e 0%,#0f0a1e 100%);
  animation:s2_appear 0.3s 3s forwards,s2_fadeout 0.3s 5.7s forwards;
}
@keyframes s2_appear{to{opacity:1}}
@keyframes s2_fadeout{to{opacity:0}}

.s2_brain{
  width:350px;height:350px;border-radius:50%;
  background:radial-gradient(circle,rgba(102,126,234,0.3),transparent 70%);
  display:flex;justify-content:center;align-items:center;position:relative;
}
.s2_sym{
  position:absolute;font-size:48px;color:rgba(255,255,255,0.6);
  animation:chaos_float 3s infinite ease-in-out;
}
.s2_sym:nth-child(1){top:10%;left:20%;animation-delay:0s}
.s2_sym:nth-child(2){top:20%;right:15%;animation-delay:0.5s}
.s2_sym:nth-child(3){bottom:30%;left:10%;animation-delay:1s}
.s2_sym:nth-child(4){bottom:15%;right:20%;animation-delay:1.5s}
.s2_sym:nth-child(5){top:50%;left:5%;animation-delay:2s}
@keyframes chaos_float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-25px) rotate(15deg)}
}

.s2_sub{
  background:rgba(0,0,0,0.7);padding:30px 60px;border-radius:20px;
  font-size:44px;color:#fff;text-align:center;margin-top:60px;
  letter-spacing:4px;backdrop-filter:blur(10px);
  animation:sub2_in 0.5s 3.5s forwards,sub2_out 0.3s 5.5s forwards;
  opacity:0;
}
@keyframes sub2_in{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes sub2_out{to{opacity:0}}

/* 场景3: 金光 6-10s */
#s3{
  background:#000;
  animation:s3_appear 0.3s 6s forwards,s3_fadeout 0.3s 9.7s forwards;
}
@keyframes s3_appear{to{opacity:1}}
@keyframes s3_fadeout{to{opacity:0}}

.s3_bolt{
  position:absolute;width:10px;height:700px;
  background:linear-gradient(180deg,rgba(255,215,0,0) 0%,rgba(255,215,0,0.8) 50%,rgba(255,215,0,0) 100%);
  filter:blur(3px);box-shadow:0 0 60px rgba(255,215,0,0.8);
  animation:bolt_in 0.4s 6.2s forwards,bolt_out 0.2s 9.5s forwards;
  opacity:0;
}
@keyframes bolt_in{to{opacity:1;height:1000px}}
@keyframes bolt_out{to{opacity:0}}

.s3_title{
  font-size:120px;font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ffaa00,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:20px;z-index:10;
  animation:title_in 0.8s 6.6s forwards,title_pulse 0.5s 8s infinite alternate;
  opacity:0;transform:scale(0.5);
}
@keyframes title_in{
  to{opacity:1;transform:scale(1) letterSpacing("10px");text-shadow:0 0 80px rgba(255,215,0,0.5)}
}
@keyframes title_pulse{
  to{text-shadow:0 0 120px rgba(255,215,0,0.8)}
}

.s3_sub{
  font-size:48px;color:rgba(255,255,255,0.8);margin-top:40px;
  animation:sub3_in 0.5s 7.4s forwards;opacity:0;
}
@keyframes sub3_in{to{opacity:1}}

.s3_bot{
  background:rgba(0,0,0,0.7);padding:30px 60px;border-radius:20px;
  font-size:38px;color:#fff;text-align:center;line-height:1.8;
  letter-spacing:2px;position:absolute;bottom:15%;
  animation:bot3_in 0.5s 7.8s forwards,bot3_out 0.3s 9.3s forwards;
  opacity:0;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
@keyframes bot3_in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes bot3_out{to{opacity:0}}

/* 场景4: 三步阶梯 10-15s */
#s4{
  background:radial-gradient(ellipse at center,#0a1a3e 0%,#050a1e 100%);
  animation:s4_appear 0.3s 10s forwards,s4_fadeout 0.3s 14.7s forwards;
}
@keyframes s4_appear{to{opacity:1}}
@keyframes s4_fadeout{to{opacity:0}}

.s4_steps{display:flex;flex-direction:column;align-items:center;gap:40px}
.s4_step{
  width:700px;padding:50px;border-radius:30px;text-align:center;
  opacity:0;transform:translateY(100px);
}
.s4_step:nth-child(1){
  background:rgba(102,126,234,0.3);border:2px solid rgba(102,126,234,0.6);
  backdrop-filter:blur(10px);
  animation:step_in 0.6s 10.5s forwards;
}
.s4_step:nth-child(3){
  background:rgba(72,219,251,0.3);border:2px solid rgba(72,219,251,0.6);
  backdrop-filter:blur(10px);
  animation:step_in 0.6s 11.3s forwards;
}
.s4_step:nth-child(5){
  background:rgba(255,215,0,0.3);border:2px solid rgba(255,215,0,0.6);
  backdrop-filter:blur(10px);
  animation:step_in 0.6s 12.1s forwards;
}
@keyframes step_in{to{opacity:1;transform:translateY(0)}}

.s4_num{font-size:60px;font-weight:900;color:rgba(255,255,255,0.3);margin-bottom:20px}
.s4_name{font-size:80px;font-weight:900;letter-spacing:15px;color:#fff}
.s4_step:nth-child(1) .s4_name{color:#667eea}
.s4_step:nth-child(3) .s4_name{color:#48dbfb}
.s4_step:nth-child(5) .s4_name{color:#ffd700}

.s4_arrow{
  font-size:60px;color:rgba(255,255,255,0.3);
  animation:arrow_down 0.3s 11s forwards,arrow_down2 0.3s 11.8s forwards;
  opacity:0;
}
@keyframes arrow_down{to{opacity:1;transform:scale(1.5)}}
@keyframes arrow_down2{to{opacity:1;transform:scale(1.5)}}

.s4_bot{
  background:rgba(0,0,0,0.7);padding:30px 60px;border-radius:20px;
  font-size:40px;color:#fff;text-align:center;margin-top:30px;
  letter-spacing:4px;backdrop-filter:blur(10px);
  animation:bot4_in 0.5s 12.8s forwards,bot4_out 0.3s 14.3s forwards;
  opacity:0;border:1px solid rgba(255,255,255,0.1);
}
@keyframes bot4_in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes bot4_out{to{opacity:0}}

/* 场景5: 火箭 15-18s */
#s5{
  background:radial-gradient(ellipse at bottom,#1a0a2e 0%,#000 100%);
  animation:s5_appear 0.3s 15s forwards,s5_fadeout 0.3s 17.7s forwards;
}
@keyframes s5_appear{to{opacity:1}}
@keyframes s5_fadeout{to{opacity:0}}

.s5_stats{text-align:center;margin-bottom:80px}
.s5_num{
  font-size:100px;font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff6b6b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.s5_label{font-size:40px;color:rgba(255,255,255,0.8);margin-top:20px}

.s5_rocket{
  font-size:200px;
  animation:rocket_up 1.5s 15.5s forwards;
  transform:translateX(-50%);
}
@keyframes rocket_up{
  0%{bottom:-20%;transform:translateX(-50%) scale(0.5)}
  60%{bottom:55%;transform:translateX(-50%) scale(1.3)}
  100%{bottom:65%;transform:translateX(-50%) scale(1.5);opacity:0}
}

.s5_bot{
  background:rgba(0,0,0,0.7);padding:30px 60px;border-radius:20px;
  font-size:40px;color:#fff;text-align:center;line-height:1.8;
  letter-spacing:4px;position:absolute;bottom:20%;
  animation:bot5_in 0.5s 16s forwards,bot5_out 0.3s 17.5s forwards;
  opacity:0;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
@keyframes bot5_in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes bot5_out{to{opacity:0}}

/* 场景6: 引导 18-20s */
#s6{
  background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a1e 100%);
  animation:s6_appear 0.3s 18s forwards;
}
@keyframes s6_appear{to{opacity:1}}

.s6_hand{
  font-size:180px;
  animation:hand_in 0.8s 18.2s forwards;
  opacity:0;transform:scale(0) rotate(-180deg);
}
@keyframes hand_in{to{opacity:1;transform:scale(1) rotate(0deg)}}

.s6_cta{
  font-size:60px;font-weight:700;color:#fff;text-align:center;line-height:1.8;
  letter-spacing:8px;margin-top:40px;
  animation:cta_in 0.6s 18.6s forwards;opacity:0;
}
@keyframes cta_in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

.s6_bubble{
  position:absolute;bottom:15%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  padding:40px 60px;border-radius:30px;
  font-size:50px;color:#fff;font-weight:700;text-align:center;line-height:1.6;
  box-shadow:0 20px 60px rgba(102,126,234,0.5);
  animation:bubble_in 0.6s 19s forwards,bubble_glow 0.3s 19.2s infinite alternate;
  opacity:0;transform:translateY(60px) scale(0.8);
}
@keyframes bubble_in{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bubble_glow{to{box-shadow:0 20px 80px rgba(102,126,234,0.8)}}

/* 水印 */
.watermark{
  position:absolute;top:5%;right:5%;font-size:28px;color:rgba(255,255,255,0.4);
  z-index:100;
}
</style>
</head>
<body>
<div id="root">
  <!-- 场景1 -->
  <div id="s1" class="scene">
    <div class="s1_books">
      <div class="s1_book"></div>
      <div class="s1_book"></div>
      <div class="s1_book"></div>
      <div class="s1_book"></div>
    </div>
    <div class="s1_laptop"><span>???</span></div>
    <div class="s1_sub">你是不是也这样?</div>
  </div>
  <!-- 场景2 -->
  <div id="s2" class="scene">
    <div class="s2_brain">
      <div class="s2_sym">?</div><div class="s2_sym">✦</div>
      <div class="s2_sym">⚡</div><div class="s2_sym">◆</div><div class="s2_sym">?</div>
    </div>
    <div class="s2_sub">学了一堆课,最后还是什么都不会?</div>
  </div>
  <!-- 场景3 -->
  <div id="s3" class="scene">
    <div class="s3_bolt"></div>
    <div class="s3_title">流程化思维</div>
    <div class="s3_sub">改变从思维开始</div>
    <div class="s3_bot">不是因为你不努力<br>是因为你没有"流程化思维"</div>
  </div>
  <!-- 场景4 -->
  <div id="s4" class="scene">
    <div class="s4_steps">
      <div class="s4_step"><div class="s4_num">01</div><div class="s4_name">拆解</div></div>
      <div class="s4_arrow">↓</div>
      <div class="s4_step"><div class="s4_num">02</div><div class="s4_name">模仿</div></div>
      <div class="s4_arrow">↓</div>
      <div class="s4_step"><div class="s4_num">03</div><div class="s4_name">创造</div></div>
    </div>
    <div class="s4_bot">学会这3步,把知识变成能力</div>
  </div>
  <!-- 场景5 -->
  <div id="s5" class="scene">
    <div class="s5_stats">
      <div class="s5_num" id="counter">0</div>
      <div class="s5_label">粉丝增长</div>
    </div>
    <div class="s5_rocket">🚀</div>
    <div class="s5_bot">一个月产出30条爆款<br>粉丝翻了10倍</div>
  </div>
  <!-- 场景6 -->
  <div id="s6" class="scene">
    <div class="s6_hand">🤝</div>
    <div class="s6_cta">你不是学不会<br>你只是没人教你怎么学</div>
    <div class="s6_bubble">💬 评论区告诉我!<br>你最想学什么技能?</div>
  </div>
  <div class="watermark">@流程化创造</div>
</div>

<script>
// 简单的数字递增动画
(function(){
  const el=document.getElementById('counter');
  if(!el)return;
  let start=null;
  const duration=1500;
  const target=100000;
  function step(ts){
    if(!start)start=ts;
    const progress=Math.min((ts-start)/duration,1);
    const eased=progress<0.5?2*progress*progress:(1-Math.pow(-2*progress+2,2)/2);
    el.textContent=Math.round(target*eased).toLocaleString();
    if(progress<1)requestAnimationFrame(step);
  }
  // 延迟启动,等火箭开始上升
  setTimeout(()=>requestAnimationFrame(step),16500);
})();
</script>
</body>
</html>
